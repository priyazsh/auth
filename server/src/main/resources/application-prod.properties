server.port=8080
server.forward-headers-strategy=framework
server.shutdown=graceful

# --- Datasource (production PostgreSQL) ---
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# --- JPA / schema ---
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# --- Spring Session (JDBC) ---
spring.session.jdbc.initialize-schema=never
spring.session.timeout=3600

# --- ES256 token signing ---
jwt.private-key-path=file:${JWT_PRIVATE_KEY_PATH}
jwt.public-key-path=file:${JWT_PUBLIC_KEY_PATH}
jwt.issuer=https://auth.priyazsh.me
jwt.audience=https://auth.priyazsh.me
jwt.ttl-seconds=3600

# --- Google OAuth2 client ---
google.client-id=${GOOGLE_CLIENT_ID}
google.client-secret=${GOOGLE_CLIENT_SECRET}
google.redirect-uri=https://auth.priyazsh.me/oauth2/callback

# --- Auth Center ---
auth.frontend-url=https://auth.priyazsh.me
# Browser origins allowed to call this API.
# Split deployment: https://auth.priyazsh.me (frontend) -> https://authapi.priyazsh.me (API).
# Add GoLink's frontend only if it calls this API directly (the OAuth redirect is not CORS).
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://auth.priyazsh.me}

# --- Seeded OAuth client ---
auth.seed.client-id=${SEED_CLIENT_ID}
auth.seed.client-secret=${SEED_CLIENT_SECRET}
auth.seed.redirect-uris=${SEED_REDIRECT_URIS}
auth.seed.name=

# --- Session cookie ---
server.servlet.session.cookie.name=SESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.same-site=lax

# --- Actuator ---
management.endpoints.web.exposure.include=health,info
