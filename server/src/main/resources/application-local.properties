server.port=8080

# --- Datasource (local PostgreSQL) ---
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/auth_db}
spring.datasource.username=${DB_USERNAME:auth_user}
spring.datasource.password=${DB_PASSWORD:change_me}
spring.datasource.driver-class-name=org.postgresql.Driver

# --- JPA / schema ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# --- Spring Session (JDBC) ---
spring.session.jdbc.initialize-schema=always
spring.session.timeout=3600

# --- ES256 token signing ---
jwt.private-key-path=file:./path/to/es256-private.pem
jwt.public-key-path=file:./path/to/es256-public.pem
jwt.issuer=http://localhost:8080
jwt.audience=http://localhost:8080
jwt.ttl-seconds=3600

# --- Google OAuth2 client ---
google.client-id=${GOOGLE_CLIENT_ID:}
google.client-secret=${GOOGLE_CLIENT_SECRET:}
google.redirect-uri=${GOOGLE_REDIRECT_URI:http://localhost:8080/oauth2/callback}

# --- Auth Center ---
auth.frontend-url=${FRONTEND_URL:http://localhost:3000}
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# --- Seeded OAuth client ---
# Local Auth Center runs on 8080, so a local Seed Client would use 8081.
auth.seed.client-id=${SEED_CLIENT_ID}
auth.seed.client-secret=${SEED_CLIENT_SECRET:change_me_client_secret}
auth.seed.redirect-uris=${SEED_REDIRECT_URIS:http://localhost:8081/api/v1/auth/callback}
auth.seed.name=

# --- Session cookie ---
server.servlet.session.cookie.name=SESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=false
server.servlet.session.cookie.same-site=lax

# --- Actuator ---
management.endpoints.web.exposure.include=health,info
